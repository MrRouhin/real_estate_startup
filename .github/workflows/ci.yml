name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Type-check and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  database:
    name: Database tests (migrations + RLS + booking flow)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations on plain Postgres
        run: |
          createdb plotline_test
          psql -v ON_ERROR_STOP=1 -d plotline_test -f supabase/tests/local_supabase_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -d plotline_test -f "$f"; done
      - name: Run SQL tests
        run: |
          for t in booking_flow_test content_test operations_crm_test; do
            out=$(psql -v ON_ERROR_STOP=1 -d plotline_test -f supabase/tests/$t.sql 2>&1)
            echo "$out"
            if echo "$out" | grep -qE '^ f$|ERROR'; then echo "::error::$t failed"; exit 1; fi
          done
